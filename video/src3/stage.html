<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Family Table film v5</title>
<!-- The v5 film, 1920×1080, stepped frame by frame by render.js with window.frame(t) under a fake clock.
     Three layers, all functions of t:
       world   isometric schematics, drawn as SVG every frame (one projection for the whole film)
       devices phones (family) and an iPad (Alex) running the live prototype; they stand up out of the world
               and lie back down into it, using the same projection, so every schematic joins every screen
       heads   headlines and the two numbers, plus a small live diagram beside each device shot
     Story and timing: STORYBOARD.md and shots.json. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: "Barlow", Arial, sans-serif; -webkit-font-smoothing: antialiased; color: #fff; background: #0D1C44; }
  #svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #lab, #devs, #heads { position: absolute; inset: 0; pointer-events: none; }
  /* each layer is its own stacking context, so a portrait never draws over a device */
  #lab { z-index: 1; } #devs { z-index: 2; } #heads { z-index: 3; } #fade { z-index: 4; }
  /* subtitles: small, centred, on the bottom band nothing else uses */
  #subs { position: absolute; left: 0; right: 0; bottom: 26px; z-index: 3; display: flex; justify-content: center; pointer-events: none; }
  #subs span { font-size: 26px; font-weight: 500; line-height: 1.3; color: #fff; background: rgba(8,16,42,.74); padding: 5px 16px 6px; border-radius: 8px; max-width: 1000px; text-align: center; }
  .face { position: absolute; left: 0; top: 0; border-radius: 50%; overflow: hidden; opacity: 0; background: #1D3270;
    box-shadow: 0 0 0 3px #fff, 0 10px 24px rgba(4,10,30,.45); }
  .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lbl { position: absolute; white-space: nowrap; font-size: 22px; font-weight: 600; color: #fff; line-height: 1.2; }
  .lbl.c { transform: translateX(-50%); text-align: center; }
  .lbl.r { transform: translateX(-100%); text-align: right; }
  .lbl small { display: block; font-size: 18px; font-weight: 500; color: #AEB9D6; }
  .lbl.soft { color: #C9D1E6; font-weight: 500; }
  .lbl.pur { color: #B9AFFF; }
  .lbl.org { color: #FF9A4D; }
  .lbl.big { font-size: 28px; font-weight: 700; }
  .dev { position: absolute; left: 0; top: 0; transform-origin: 0 0; opacity: 0; }
  .bez { position: absolute; left: 0; top: 0; background: #0A1430; box-shadow: 0 0 0 2px rgba(255,255,255,.2), 0 50px 90px rgba(3,8,26,.45); }
  .phone .bez { width: 414px; height: 868px; border-radius: 60px; }
  .phone .scr { position: absolute; left: 12px; top: 12px; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: #fff; }
  .tab .bez { width: 1418px; height: 1076px; border-radius: 48px; }
  .tab .scr { position: absolute; left: 26px; top: 26px; width: 1366px; height: 1024px; border-radius: 22px; overflow: hidden; background: #fff; }
  .scr iframe { position: absolute; left: 0; top: 0; border: 0; }
  .phone iframe { width: 390px; height: 844px; }
  .tab iframe { width: 1366px; height: 1024px; }
  .fx { position: absolute; inset: 0; pointer-events: none; }
  .tap { position: absolute; left: 0; top: 0; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(16,33,77,.2); border: 2px solid rgba(16,33,77,.4); opacity: 0; }
  .cursor { position: absolute; left: 0; top: 0; width: 44px; height: 61px; opacity: 0; transform-origin: 3px 3px; }
  .ring { position: absolute; left: 0; top: 0; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%; border: 5px solid #EF6A00; opacity: 0; }
  .hd { position: absolute; left: 150px; width: 600px; }
  .hd .pills { display: flex; gap: 10px; margin-bottom: 26px; }
  .hd .pills span { font-size: 22px; font-weight: 600; padding: 5px 18px; border-radius: 26px; border: 2px solid #3A5299; color: #9AA7CC; }
  .hd .pills span.on { background: #EF6A00; border-color: #EF6A00; color: #fff; }
  .hd h1 { font-size: 64px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.06; margin: 0; }
  .hd p { font-size: 30px; font-weight: 500; color: #C9D1E6; line-height: 1.32; margin: 22px 0 0; }
  .hd .num { font-size: 210px; font-weight: 700; letter-spacing: -0.035em; line-height: .92; color: #EF6A00; margin: 0; }
  .hd .num.mid { font-size: 150px; }
  .hd .src { font-size: 18px; color: #8592BA; margin-top: 26px; }
  .end { position: absolute; left: 0; right: 0; text-align: center; }
  .end h1 { font-size: 110px; font-weight: 700; letter-spacing: -0.025em; margin: 0; }
  .end p { font-size: 40px; font-weight: 500; color: #C9D1E6; margin: 18px 0 0; }
  .end .team { font-size: 22px; color: #AEB9D6; margin-top: 70px; }
  .end .note { font-size: 17px; color: #7F8CB3; margin-top: 12px; }
</style>
</head>
<body>
<svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gfade" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#fff"/><stop offset=".75" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="gmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><rect x="0" y="0" width="1920" height="1080" fill="url(#gfade)"/></mask>
  </defs>
  <g id="gw"></g>
</svg>
<div id="lab"><div id="labt"></div></div>
<div id="devs"></div>
<div id="heads"></div>
<div id="subs"></div>
<div id="fade" style="position:absolute;inset:0;background:#0D1C44;opacity:0"></div>
<script>
// ---------------------------------------------------------------- helpers
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const io = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;   // cubic in-out
const outC = p => 1 - Math.pow(1 - p, 3);
const mix = (a, b, p) => a + (b - a) * p;
const seg = (t, a, d) => io(clamp((t - a) / d));
const win = (t, a, b, f = .6) => seg(t, a, f) * (1 - seg(t, b - f, f));   // fade in at a, out by b
const lerp = (a, b, p) => { const o = {}; for (const k in b) o[k] = (typeof b[k] === "number" ? a[k] + (b[k] - a[k]) * p : b[k]); return o; };
const fx = n => n.toFixed(1);
const PROTO = "../../prototype/index.html?reset#/story/hook";
let CFG, XF, K = {}, T_END = 0;

class Track {
  constructor(init) { this.init = init; this.k = []; }
  to(t, d, v) { this.k.push({ t, d, v }); this.k.sort((a, b) => a.t - b.t); return this; }
  base() { if (typeof this.init === "function") this.init = this.init(); return this.init; }
  value(t) {
    let v = this.base();
    for (const k of this.k) {
      if (t < k.t) break;
      if (!k.done) { k.val = typeof k.v === "function" ? k.v() : k.v; k.from = v; k.done = true; }
      v = lerp(k.from, k.val, io(clamp((t - k.t) / k.d)));
    }
    return v;
  }
  last() { let v = this.base(); for (const k of this.k) if (k.done) v = k.val; return v; }
}

// ---------------------------------------------------------------- isometric world
// x → (cos30, sin30), y → (−cos30, sin30), z up. A unit square on the floor is the same diamond a device makes with
// rotateX(54.7356deg) rotateZ(45deg), so devices can lie on this floor exactly.
const IC = .70710678, IS = .40824829, IV = .81649658;
// `until`: the push eases back out by the time a dive lands, so a device rises from exactly the planned spot
const push = (c, t, t0, rate = .006, until = 1e9) => ({ ...c, k: c.k * (1 + rate * Math.max(0, t - t0) * (1 - seg(t, until, 1.4))) });
const iso = c => { const f = (x, y, z = 0) => [c.ox + (x - y) * IC * c.k, c.oy + (x + y) * IS * c.k - z * IV * c.k]; f.k = c.k; return f; };
const COL = {
  navy:  { t: "#1D3270", l: "#15275C", r: "#0F1E4B", e: "#3A5299" },
  navy2: { t: "#16295F", l: "#11214F", r: "#0C1940", e: "#2E4486" },
  org:   { t: "#EF6A00", l: "#C45600", r: "#9C4500", e: "#FF9A4D" },
  pur:   { t: "#7C6CF0", l: "#5F50D0", r: "#4A3CB0", e: "#A99DFF" },
  ice:   { t: "#E8ECF6", l: "#C2CADF", r: "#A0ABC8", e: "#FFFFFF" },
  sky:   { t: "#BFD3F2", l: "#98B0D8", r: "#7C94C0", e: "#E2ECFF" },
  doc:   { t: "#FFFFFF", l: "#D5DAE8", r: "#B5BDD2", e: "#FFFFFF" },
};
const pts = a => a.map(p => fx(p[0]) + "," + fx(p[1])).join(" ");
function quad(P, c, fill, o, stroke = "none", sw = 1) { return `<polygon points="${pts(c.map(q => P(...q)))}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" opacity="${o.toFixed(3)}"/>`; }
// a solid box seen from the front: top, the +y face (left) and the +x face (right)
function box(P, x, y, z, w, d, h, c, o = 1, edge = true) {
  if (o <= .002) return "";
  const t = z + h, e = edge ? c.e : "none";
  let s = "";
  if (h > .002) {
    s += quad(P, [[x, y + d, z], [x + w, y + d, z], [x + w, y + d, t], [x, y + d, t]], c.l, o, e, .8);
    s += quad(P, [[x + w, y, z], [x + w, y + d, z], [x + w, y + d, t], [x + w, y, t]], c.r, o, e, .8);
  }
  return s + quad(P, [[x, y, t], [x + w, y, t], [x + w, y + d, t], [x, y + d, t]], c.t, o, e, 1.1);
}
const boxC = (P, cx, cy, z, w, d, h, c, o, edge) => box(P, cx - w / 2, cy - d / 2, z, w, d, h, c, o, edge);
// a glass box: faint faces, every edge drawn, back edges fainter
function glass(P, cx, cy, z, w, d, h, o, tint = "#DCE4FF") {
  if (o <= .002) return "";
  const x = cx - w / 2, y = cy - d / 2, t = z + h, L = (a, b, op) => `<line x1="${fx(P(...a)[0])}" y1="${fx(P(...a)[1])}" x2="${fx(P(...b)[0])}" y2="${fx(P(...b)[1])}" stroke="${tint}" stroke-width="1.6" opacity="${(o * op).toFixed(3)}"/>`;
  let s = quad(P, [[x, y + d, z], [x + w, y + d, z], [x + w, y + d, t], [x, y + d, t]], tint, o * .07)
        + quad(P, [[x + w, y, z], [x + w, y + d, z], [x + w, y + d, t], [x + w, y, t]], tint, o * .05)
        + quad(P, [[x, y, t], [x + w, y, t], [x + w, y + d, t], [x, y + d, t]], tint, o * .1);
  s += L([x, y, z], [x + w, y, z], .3) + L([x, y, z], [x, y + d, z], .3) + L([x, y, z], [x, y, t], .3);
  [[[x + w, y, z], [x + w, y + d, z]], [[x, y + d, z], [x + w, y + d, z]], [[x + w, y + d, z], [x + w, y + d, t]], [[x + w, y, z], [x + w, y, t]], [[x, y + d, z], [x, y + d, t]],
   [[x, y, t], [x + w, y, t]], [[x, y, t], [x, y + d, t]], [[x + w, y, t], [x + w, y + d, t]], [[x, y + d, t], [x + w, y + d, t]]].forEach(([a, b]) => s += L(a, b, .85));
  return s;
}
function line3(P, a, b, stroke, sw, o, dash = "", off = 0) {
  if (o <= .002) return "";
  const p = P(...a), q = P(...b);
  return `<line x1="${fx(p[0])}" y1="${fx(p[1])}" x2="${fx(q[0])}" y2="${fx(q[1])}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" opacity="${o.toFixed(3)}"${dash ? ` stroke-dasharray="${dash}" stroke-dashoffset="${off.toFixed(1)}"` : ""}/>`;
}
const at3 = (a, b, p) => [mix(a[0], b[0], p), mix(a[1], b[1], p), mix(a[2], b[2], p)];
// a flat circle on a horizontal plane (an ellipse on screen)
function disc(P, x, y, z, r, fill, o, stroke = "none", sw = 2) { const [sx, sy] = P(x, y, z); return o > .002 ? `<ellipse cx="${fx(sx)}" cy="${fx(sy)}" rx="${fx(r * P.k)}" ry="${fx(r * P.k * .57735)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${o.toFixed(3)}"/>` : ""; }
// text lying on a horizontal plane, reading up and to the right
function floorText(P, x, y, z, txt, size, fill, o, weight = 700) { const [sx, sy] = P(x, y, z); return o > .002 ? `<text transform="matrix(${IC},${-IS},${IC},${IS},${fx(sx)},${fx(sy)})" font-family="Barlow" font-weight="${weight}" font-size="${fx(size * P.k)}" fill="${fill}" text-anchor="middle" dominant-baseline="middle" opacity="${o.toFixed(3)}">${txt}</text>` : ""; }
// the Family Table mark lying on a plane: ring, three seats, an orange centre
const SEAT_ANG = [-90, 21.8, 158.2];   // the app mark: seats at (16,5), (26,20), (6,20) on a 32-unit grid
function markFlat(P, x, y, z, r, o, base = false) {
  if (o <= .002) return "";
  let s = base ? disc(P, x, y, z, r * 1.32, "#16295F", o) : "";
  s += disc(P, x, y, z, r, "none", o, "#fff", Math.max(2, r * P.k * .13));
  SEAT_ANG.forEach(a => { const q = a * Math.PI / 180; s += disc(P, x + r * .786 * Math.cos(q), y + r * .786 * Math.sin(q), z, r * .171, "#fff", o); });
  return s + disc(P, x, y, z, r * .357, "#EF6A00", o);
}
// an upright cylinder: side band, then the top
function cyl(P, x, y, z, r, h, top, side, o) {
  if (o <= .002 || r <= 0) return "";
  const [bx, by] = P(x, y, z), [tx, ty] = P(x, y, z + h), rx = r * P.k, ry = rx * .57735;
  return `<g opacity="${o.toFixed(3)}"><ellipse cx="${fx(bx)}" cy="${fx(by)}" rx="${fx(rx)}" ry="${fx(ry)}" fill="${side}"/><rect x="${fx(tx - rx)}" y="${fx(ty)}" width="${fx(2 * rx)}" height="${fx(by - ty)}" fill="${side}"/><ellipse cx="${fx(tx)}" cy="${fx(ty)}" rx="${fx(rx)}" ry="${fx(ry)}" fill="${top}"/></g>`;
}
function grid(P, o, n = 12) {
  if (o <= .002) return "";
  let s = `<g mask="url(#gmask)" opacity="${o.toFixed(3)}">`;
  for (let i = -n; i <= n; i++) { s += line3(P, [i, -n, 0], [i, n, 0], "#2C4180", 1, .55); s += line3(P, [-n, i, 0], [n, i, 0], "#2C4180", 1, .55); }
  return s + "</g>";
}
const LOCK = (x, y, sz, col, o) => `<g transform="translate(${fx(x)},${fx(y)}) scale(${(sz / 24).toFixed(3)})" opacity="${o.toFixed(3)}"><rect x="-8" y="-2" width="16" height="12" rx="2.5" fill="${col}"/><path d="M-5 -2 V-6 a5 5 0 0 1 10 0 V-2" fill="none" stroke="${col}" stroke-width="2.6"/></g>`;
const CHECK = (x, y, r, o, bg = "#EF6A00") => o > .002 ? `<g transform="translate(${fx(x)},${fx(y)})" opacity="${o.toFixed(3)}"><circle r="${r}" fill="${bg}"/><path d="M${-r * .42} 0 L${-r * .1} ${r * .32} L${r * .45} ${-r * .3}" fill="none" stroke="#fff" stroke-width="${(r * .2).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round"/></g>` : "";

// ---------------------------------------------------------------- per-frame output: svg, labels, portraits
let OUT;
const FACE_NAMES = ["margaret", "tom", "ben", "claire", "sam", "alex"], FACES = {};
function makeFaces() {
  const lab = document.getElementById("lab"), loads = [];
  for (const n of FACE_NAMES) { FACES[n] = [0, 1].map(() => { const d = document.createElement("div"); d.className = "face"; const im = document.createElement("img"); im.src = `../../prototype/faces/${n}.jpg`; loads.push(im.decode().catch(() => {})); d.appendChild(im); lab.insertBefore(d, lab.firstChild); return d; }); }
  return Promise.all(loads);
}
// a portrait floating at (sx, sy) on screen, diameter d
function face(name, sx, sy, d, o, depth = 0) { if (o > .002 && d > 1) OUT.faces.push({ name, sx, sy, d, o, depth }); }
// a portrait in the world: a stem to the floor, a shadow, the portrait, an optional name
function person(P, name, x, y, z, d, o, label, cls = "", floor = 0) {
  if (o <= .002) return;
  const [bx, by] = P(x, y, floor), [sx, sy] = P(x, y, z);
  OUT.svg.push(disc(P, x, y, floor, .32, "#050C24", o * .45) + `<line x1="${fx(bx)}" y1="${fx(by)}" x2="${fx(sx)}" y2="${fx(sy)}" stroke="#7F90C4" stroke-width="1.5" opacity="${(o * .6).toFixed(3)}"/>`);
  face(name, sx, sy, d, o, x + y);
  if (label) OUT.lab.push(lbl(sx, sy + d / 2 + 12, label, "c " + cls, o));
}
function lbl(x, y, html, cls, o) { return o > .002 ? `<div class="lbl ${cls}" style="left:${fx(x)}px;top:${fx(y)}px;opacity:${o.toFixed(3)}">${html}</div>` : ""; }
// a leader line from a point to a label
function leader(a, b, o, col = "#7F90C4") { return o > .002 ? `<polyline points="${fx(a[0])},${fx(a[1])} ${fx(b[0])},${fx(b[1])}" fill="none" stroke="${col}" stroke-width="1.5" opacity="${o.toFixed(3)}"/><circle cx="${fx(a[0])}" cy="${fx(a[1])}" r="3.5" fill="${col}" opacity="${o.toFixed(3)}"/>` : ""; }
// a small cube travelling along a polyline in the world, at fraction p
function packet(P, path, p, c, o, s = .22) {
  if (o <= .002) return "";
  const n = path.length - 1, f = clamp(p) * n, i = Math.min(n - 1, Math.floor(f)), q = at3(path[i], path[i + 1], f - i);
  return boxC(P, q[0], q[1], q[2] - s / 2, s, s, s, c, o);
}
function flowPath(P, path, stroke, sw, o, t, speed = 30) {
  if (o <= .002) return "";
  return path.slice(1).map((b, i) => line3(P, path[i], b, stroke, sw, o, "2 10", -t * speed)).join("");
}

// ---------------------------------------------------------------- devices
const DEV = {
  phone: { W: 414, H: 868, b: 12, sw: 390, sh: 844, home: { X: 1330, Y: 540, s: 1.0 } },
  tab:   { W: 1418, H: 1076, b: 26, sw: 1366, sh: 1024, home: { X: 1300, Y: 548, s: .735 } },
};
const CURSOR = `<svg class="cursor" viewBox="0 0 36 50"><path d="M3 3 L3 39 L12 30.5 L18.5 45 L25 42 L18.6 28 L30.5 28 Z" fill="#fff" stroke="#14181F" stroke-width="2.4" stroke-linejoin="round"/></svg>`;
let SLOTS = {}, SHOTS = [];
function el(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e; }
function makeSlots() {
  const root = document.getElementById("devs"), loads = [];
  for (const kind of ["phone", "tab"]) for (const L of ["A", "B"]) {
    const d = el("div", "dev " + kind, root), bez = el("div", "bez", d), scr = el("div", "scr", bez);
    const f = el("iframe", "", scr); loads.push(new Promise(r => f.addEventListener("load", r, { once: true }))); f.src = PROTO;
    const fxl = el("div", "fx", scr, `<div class="tap"></div><div class="tap"></div>${CURSOR}<div class="ring"></div>`);
    SLOTS[kind + L] = { el: d, bez, frame: f, taps: [...fxl.querySelectorAll(".tap")], cursor: fxl.querySelector(".cursor"), ring: fxl.querySelector(".ring") };
  }
  return Promise.all(loads);
}
const hashed = w => new Promise(r => w.addEventListener("hashchange", () => r(), { once: true }));
async function settle(w) { await w.document.fonts.ready; await Promise.all([...w.document.images].map(i => i.decode().catch(() => {}))); }
async function go(w, route, st) {
  w.FT.reset(); if (st) w.FT.set(JSON.parse(JSON.stringify(st)));
  const target = "#/" + route;
  if (w.location.hash === target) { const h = hashed(w); w.location.hash = "#/story/close"; await h; }
  const h = hashed(w); w.location.hash = target; await h;
  w.scrollTo(0, 0); await settle(w);
}
const born = new WeakMap();
function seekAnims(t) {
  const ms = t * 1000;
  for (const k in SLOTS) { const d = SLOTS[k].frame.contentDocument; if (!d) continue;
    for (const a of d.getAnimations()) { if (!born.has(a)) { born.set(a, ms); a.pause(); } try { a.currentTime = ms - born.get(a); } catch (e) {} } }
}
const home = (D, extra = {}) => Object.assign({ X: D.home.X, Y: D.home.Y, s: D.home.s, a: 0, o: 1, gx: D.W / 2, gy: D.H / 2 }, extra);
// a pose lying flat at a stage point, small and transparent: where devices come from and go to
const flat = (D, X, Y, s, o = 0) => ({ X, Y, s, a: 1, o, gx: D.W / 2, gy: D.H / 2 });

function makeShot(kind, o) {
  const D = DEV[kind], sh = Object.assign({ kind, D, acts: [], ticks: [], taps: [], rings: [] }, o);
  sh.win = () => sh.slot.frame.contentWindow;
  sh.doc = () => sh.win().document;
  sh.q = sel => sh.doc().querySelector(sel);

    a.focus(k0 + 3.0, .9, '[data-act="vote"]', 1.18, null, null, 0, -120);
    a.tap(k0 + 4.6, '[data-act="vote"]');
    const d = add("phone", { name: "decide", t0: k0 + 5.8, t1: k0 + 12.8, route: "me/sam/decide", state: { ...BASE, votes: { sam: "balanced" } }, cont: true, from: () => a.v.value(k0 + 5.8) });
    const trust = '[data-act="tree"][data-k="pay"][data-id="trust"]', half = '[data-act="tree"][data-k="earn"][data-id="half"]';
    d.focus(k0 + 5.8, .9, trust, 1.18);
    d.scrollTo(k0 + 6.0, .7, () => d.R(trust).cy - 470);
    d.tap(k0 + 7.4, trust);
    d.scrollTo(k0 + 7.7, .7, () => d.R(half).cy - 470);
    d.tap(k0 + 8.9, half);
    d.scrollTo(k0 + 9.5, .8, 0);
    d.focus(k0 + 9.5, .9, ".hero", 1.25);
    head(k0 + .5, k0 + 11.7, { pill: 1, h: "Twelve plans become one.", p: "Sam sees his own number under every split, and votes in private." });
    mini(k0 + .8, k0 + 11.8, miniPlans);
  }
  // ---- 9 activate: Sam asks, Alex approves on the iPad, the answer reaches Sam
  {
    const k0 = K.activate, st = { ...BASE, votes: { sam: "balanced" } };
    const q = add("phone", { name: "ask", t0: k0 - .1, t1: k0 + 4.4, route: "me/sam/ask", state: st, cont: true, from: () => SHOTS_BY.decide.v.value(k0 - .1) });
    q.to(k0 - .1, .9, home(P));
    q.focus(k0 + .6, 1.0, ".ask-hero", 1.18, null, null, 0, 120);
    q.tap(k0 + 1.4, '.chip[data-act="send-q"][data-id="0"]');
    q.to(k0 + 3.3, 1.0, flat(P, 1450, 800, .3));
    const ib = add("tab", { name: "inbox", t0: k0 + 3.1, t1: k0 + 8.9, route: "advisor/inbox", state: { ...st, msgs: [SAM_MSG], replies: { "seed-claire": CLAIRE_DRAFT } }, from: flat(T, 1250, 800, .3) });
    ib.to(k0 + 3.2, 1.2, home(T));
    ib.focus(k0 + 4.2, 1.0, '.inmsg[data-msg="sam-demo"]', 1.2, 1200, 520);
    ib.click(k0 + 6.4, '[data-act="send"][data-id="sam-demo"]');
    ib.home(k0 + 6.9, .8);
    ib.to(k0 + 7.8, 1.0, flat(T, 1250, 820, .3));
    const r = add("phone", { name: "reply", t0: k0 + 7.6, t1: k0 + 12.9, route: "me/sam/ask", state: { ...st, msgs: [SAM_MSG], replies: { "sam-demo": SAM_DRAFT } }, from: flat(P, 1400, 800, .3) });
    r.to(k0 + 7.7, 1.2, home(P));
    r.focus(k0 + 8.6, 1.1, ".msg.alex", 1.22);
    r.to(k0 + 11.5, 1.2, flat(P, 1290, 720, .25));
    head(k0 + .4, k0 + 11.6, { pill: 2, h: "Ask a person, not a bot.", p: "AI drafts the answer. Alex checks it and sends it. Nothing reaches the family until he approves." });
    mini(k0 + .6, k0 + 11.7, miniAsk, 50);
  }
  // ---- 10–12 world C: one year on, the stack, the close
  {
    const Y = K.yearone, St = K.stack, Cl = K.close;
    CAM_C = new Track({ ox: 1330, oy: 520, k: 120 });
    CAM_C.to(Y - .6, 1.6, { ox: 1310, oy: 560, k: 96 })
         .to(St + .2, 2.0, { ox: 1010, oy: 590, k: 64 })
         .to(Cl - .1, 1.4, { ox: 975, oy: 380, k: 112 });
    world(Y - .8, T_END, worldC);
    head(Y + .4, St - .1, { num: t => t < Y + 3.2 ? "3 of 5" : t < Y + 4.0 ? "4 of 5" : "5 of 5", numCls: "mid", h: "family members work with PNC.", p: "One year on, the sale has closed and the plan is everyday banking.", top: 300 });
    head(St + .4, Cl - .2, { h: "Why only PNC?", p: "Three proprietary assets in one consented stack.", top: 380 });
    head(Cl + 1.6, T_END, { nodim: true, top: 600, end: () => `<h1>Family Table</h1><p>A plan the family trusts.</p><div class="team">Alen Ilmi, Rizaldy Utomo, Nindy Aditya Dewi and Aditya Mulya Pratama · Carnegie Mellon University</div>` });
  }
  SHOTS = sh;
  return sh;
}
let SHOTS_BY = {};
function assign() {
  const next = { phone: "A", tab: "A" };
  SHOTS.forEach((s, i) => { s.index = i; SHOTS_BY[s.name] = s; s.slot = SLOTS[s.kind + next[s.kind]]; next[s.kind] = next[s.kind] === "A" ? "B" : "A"; });
  // a shot that continues on the same device takes over its pose and its slot pair's other half
  for (const s of SHOTS) for (const o of SHOTS) if (o !== s && o.slot === s.slot && o.index > s.index && o.t0 < s.t1) throw new Error(`slot clash: ${s.name} and ${o.name}`);
}

// ---------------------------------------------------------------- one frame
let busy = false;
// film time `out` (after any warp to a take) drives the subtitles; story time t drives everything else
window.SUBS = [];
function drawSubs(out) {
  const c = window.SUBS.find(c => out >= c.a && out < c.b), el = document.getElementById("subs");
  if (!c) { el.innerHTML = ""; return; }
  const o = Math.min(1, (out - c.a) / .12, (c.b - out) / .12);
  el.innerHTML = `<span style="opacity:${o.toFixed(3)}">${c.text}</span>`;
}
window.frame = async (t, out = t) => {
  if (busy) throw new Error("frame() re-entered"); busy = true;
  const touched = new Set();
  for (const s of SHOTS) if (!s.ready && t >= s.t0 - .05 && t < s.t1) await setup(s);
  for (const s of SHOTS) {
    if (!s.ready || t > s.t1) continue;
    for (const a of s.acts) if (!a.done && t >= a.t) { a.done = true; await a.fn(); touched.add(s); }
    for (const k of s.ticks) if (t >= k.t0 && !k.end) { k.fn(clamp((t - k.t0) / (k.t1 - k.t0))); if (t >= k.t1) k.end = true; touched.add(s); }
  }
  for (const s of touched) await settle(s.win());
  // devices
  for (const name in SLOTS) {
    const S = SLOTS[name], live = SHOTS.filter(x => x.slot === S && x.ready && t >= x.t0 && t <= x.t1);
    if (!live.length) { S.el.style.opacity = 0; continue; }
    drawDev(live[live.length - 1], t);
  }
  // world and side diagrams
  OUT = { svg: [], lab: [], faces: [] };
  for (const w of WORLDS) if (t >= w.t0 && t <= w.t1) w.fn(t);
  document.getElementById("gw").innerHTML = OUT.svg.join("");
  document.getElementById("labt").innerHTML = OUT.lab.join("");
  const used = {}; for (const n of FACE_NAMES) FACES[n].forEach(e => e.style.opacity = 0);
  OUT.faces.sort((a, b) => a.depth - b.depth).forEach((f, i) => { const k = used[f.name] = (used[f.name] || 0); used[f.name]++; const e = FACES[f.name][k]; if (!e) return;
    e.style.opacity = f.o.toFixed(3); e.style.width = e.style.height = f.d.toFixed(1) + "px"; e.style.zIndex = 10 + i;
    e.style.transform = `translate(${(f.sx - f.d / 2).toFixed(1)}px,${(f.sy - f.d / 2).toFixed(1)}px)`; });
  drawHeads(t);
  drawSubs(out);
  // the very end settles to navy
  document.getElementById("fade").style.opacity = seg(t, T_END - .8, .75).toFixed(3);
  seekAnims(t);
  busy = false;
};
window.boot = async () => {
  CFG = await (await fetch("shots.json")).json(); XF = CFG.xfade;
  await Promise.all([makeSlots(), makeFaces()]);
  await document.fonts.ready;
  for (const k in SLOTS) await settle(SLOTS[k].frame.contentWindow);
  build(); assign();
  window.TOTAL = T_END;
  return SHOTS.map(s => ({ name: s.name, kind: s.kind, t0: +s.t0.toFixed(2), t1: +s.t1.toFixed(2), route: s.route }));
};
